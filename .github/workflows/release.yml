name: release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate manifest
        shell: bash
        run: python - <<'PY'
import json
from pathlib import Path
m=json.loads(Path('manifest.json').read_text())
assert m['manifest_version'] == 3
assert m['version']
assert Path('popup.html').exists()
assert Path('popup.js').exists()
assert Path('sidepanel.html').exists()
assert Path('sidepanel.js').exists()
assert Path('background.js').exists()
print('manifest', m['version'])
PY

      - name: Package extension
        shell: bash
        run: |
          VERSION=$(python -c "import json; print(json.load(open('manifest.json'))['version'])")
          mkdir -p dist
          zip -r "dist/repo-create-ext-v${VERSION}.zip" \
            manifest.json background.js popup.html popup.js sidepanel.html sidepanel.js styles.css README.md agent.md docs

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*.zip
